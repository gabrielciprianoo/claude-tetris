<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select" class="skin-select">
            <option value="retro">Retro</option>
            <option value="neon">Neon</option>
            <option value="pastel">Pastel</option>
            <option value="pixelart">Pixel Art</option>
          </select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Pause / Game-over overlay -->
    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title" class="overlay-title-text">PAUSA</p>
        <p id="overlay-score"></p>

        <!-- Pause menu buttons -->
        <div id="pause-actions" class="overlay-actions">
          <button id="resume-btn" class="overlay-btn overlay-btn-primary">Reanudar</button>
          <button id="restart-btn" class="overlay-btn">Reiniciar</button>
          <button id="controls-btn" class="overlay-btn">Ver controles</button>
          <p id="pause-level-info" class="overlay-info"></p>
        </div>

        <!-- Inline controls panel (toggle) -->
        <div id="controls-panel" class="controls-panel hidden">
          <ul class="controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar suave</li>
            <li><kbd>Space</kbd> caída dura</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <button id="controls-back-btn" class="overlay-btn overlay-btn-small">Volver</button>
        </div>

        <!-- Game-over actions -->
        <div id="gameover-actions" class="overlay-actions hidden">
          <!-- Name entry -->
          <div id="name-entry-section" class="name-entry-section">
            <label for="name-input" class="name-entry-label">Tu nombre:</label>
            <div class="name-entry-row">
              <input id="name-input" type="text" maxlength="20" placeholder="Anónimo" class="name-input" />
              <button id="save-score-btn" class="overlay-btn">Guardar</button>
            </div>
          </div>
          <p id="save-message" class="save-message"></p>

          <!-- Records table in game-over overlay -->
          <div class="records-section">
            <p class="records-title">RÉCORDS</p>
            <table id="records-table-gameover" class="records-table"></table>
            <button id="reset-records-btn" class="reset-btn">Restablecer récords</button>
          </div>

          <button id="gameover-restart-btn" class="overlay-btn overlay-btn-primary">Reiniciar</button>
        </div>
      </div>
    </div>

    <!-- Start screen overlay -->
    <div id="start-overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="start-title" class="overlay-title-text">TETRIS</p>
        <div class="level-selector">
          <label for="start-level-select" class="overlay-label">Nivel inicial</label>
          <select id="start-level-select" class="level-select"></select>
        </div>
        <button id="play-btn" class="overlay-btn overlay-btn-primary">Jugar</button>

        <!-- Records table on start screen -->
        <div class="records-section">
          <p class="records-title">RÉCORDS</p>
          <table id="records-table-start" class="records-table"></table>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
