<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Game-over / pause overlay -->
    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Name entry (game-over only) -->
        <div id="name-entry-section" class="name-entry-section hidden">
          <label for="name-input" class="name-entry-label">Tu nombre:</label>
          <div class="name-entry-row">
            <input id="name-input" type="text" maxlength="20" placeholder="Anónimo" class="name-input" />
            <button id="save-score-btn" class="action-btn">Guardar</button>
          </div>
        </div>
        <p id="save-message" class="save-message"></p>

        <!-- Records table in game-over overlay -->
        <div class="records-section">
          <p class="records-title">RÉCORDS</p>
          <table id="records-table-gameover" class="records-table"></table>
          <button id="reset-records-btn" class="reset-btn">Restablecer récords</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Start screen overlay -->
    <div id="start-overlay" class="overlay hidden">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <button id="play-btn" class="action-btn action-btn--primary">Jugar</button>

        <!-- Records table on start screen -->
        <div class="records-section">
          <p class="records-title">RÉCORDS</p>
          <table id="records-table-start" class="records-table"></table>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
